# Default Pipeline Configuration
# ================================
# Target GPU: NVIDIA RTX 4060 (8GB VRAM)
# For constrained setups, see low_vram.yaml

# Image Ingestion
target_image_size: 512

# Segmentation (SAM 2)
sam2_checkpoint: "checkpoints/sam2/sam2.1_hiera_large.pt"
sam2_model_cfg: "configs/sam2.1/sam2.1_hiera_l.yaml"
use_rembg_fallback: true
mask_morph_kernel_size: 5
cross_view_iou_threshold: 0.7

# 3D Reconstruction
crm_checkpoint_dir: "checkpoints/crm"
unique3d_checkpoint_dir: "checkpoints/unique3d"
target_face_count: 50000
target_quad_count: 10000
mesh_smoothing_iterations: 3
crm_conda_env: "crm"
unique3d_conda_env: ""
triposr_conda_env: ""             # Empty = use current Python (no conda needed)
triposr_mc_resolution: 512        # Marching cubes grid resolution (higher = more detail)
triposr_chunk_size: 8192          # Surface extraction chunk size (lower = less VRAM)
reconstruction_timeout: 300
use_pymeshlab_postprocess: true

# Semantic Partitioning (DINOv2 + Spectral Clustering)
sampart3d_checkpoint: "checkpoints/sampart3d"
n_sample_points: 100000
n_render_views: 12
render_resolution: 224
n_target_parts: 8
min_part_faces: 50
boundary_smoothing_iterations: 3
partition_method: "spectral"       # "spectral", "kmeans", or "sampart3d"
spectral_n_neighbors: 20          # k-NN neighbors for spectral clustering graph
feature_weight: 0.7               # 0=geometry only, 1=DINOv2 features only
dinov2_model: "dinov2_vitl14"     # DINOv2 model variant (vitl14 = ViT-L/14)
sampart3d_conda_env: "sampart3d"  # conda env for SAMPart3D subprocess

# USD Export
usd_scene_name: "Root_Scene"
export_y_up: true
export_z_up: true

# GPU Settings
device: "cuda"
use_float16: false
max_batch_size: 8
