name: CI — Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest
          pip install numpy opencv-python Pillow trimesh pyyaml click rich scipy

      - name: Lint with ruff
        run: ruff check src/ tests/ main.py

      - name: Check formatting with black
        run: black --check src/ tests/ main.py

      - name: Run tests (CPU-only, no GPU-dependent tests)
        run: |
          pytest tests/test_stage0.py tests/test_stage1.py tests/test_stage2.py tests/test_stage3.py -v

